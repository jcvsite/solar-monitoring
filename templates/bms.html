<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BMS Compact View</title>
	<style>
		html {
			box-sizing: border-box;
			font-size: 14px;
		}

		*,
		*:before,
		*:after {
			box-sizing: inherit;
		}

		:root {
			--bg-primary: #ffeb99;
			--bg-secondary: #fffacd;
			--bg-tertiary: rgba(211, 84, 0, 0.05);
			--text-primary: #d35400;
			--text-secondary: #555555;
			--text-accent: #d35400;
			--border-color: rgba(211, 84, 0, 0.2);
			--cell-border-default: #d35400;
			--cell-default-bg: #fdf5e6;
			--icon-color: #e67e22;
			--status-good-color: #27ae60;
			--status-warning-color: #f39c12;
			--status-critical-color: #c0392b;
			--status-info-color: #2980b9;
			--font-family: "Poppins", Arial, sans-serif;
			--cell-text-color: #333;
			--cell-text-shadow: none;
			--cell-cap-bg: #f1c40f;
			--cell-cap-border: #d35400;
		}

		[data-theme="dark"] {
			--bg-primary: #000000;
			--bg-secondary: rgba(35, 35, 35, 0.9);
			--bg-tertiary: rgba(52, 152, 219, 0.1);
			--text-primary: #ecf0f1;
			--text-secondary: #bdc3c7;
			--text-accent: #3498db;
			--border-color: rgba(52, 152, 219, 0.25);
			--cell-border-default: #3498db;
			--cell-default-bg: #2c3e50;
			--icon-color: #3498db;
			--status-good-color: #178344;
			--status-warning-color: #856b03;
			--status-critical-color: #c41401;
			--status-info-color: #3498db;
			--cell-text-color: #ecf0f1;
			--cell-text-shadow: 0 0 2px black;
			--cell-cap-bg: #3498db;
			--cell-cap-border: #2980b9;
		}

		html,
		body {
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		body {
			font-family: var(--font-family);
			background-color: transparent;
			color: var(--text-primary);
			display: block;
			height: 100%;
			font-size: 1rem;
		}

		.bms-dashboard {
			background-color: transparent;
			width: 100%;
			height: 100%;
			display: grid;
			/* Top + bottom size to content; cells take only leftover space */
			grid-template-rows: auto minmax(0, 1fr) auto;
			grid-template-areas:
				"top"
				"cells"
				"bottom";
			overflow: hidden;
			border: none;
			gap: 3px;
			padding: 0;
			box-sizing: border-box;
		}

		.summary-data-top {
			grid-area: top;
		}

		.summary-data-bottom {
			grid-area: bottom;
		}

		.summary-data-top,
		.summary-data-bottom {
			display: grid;
			grid-template-columns: 1fr 1.2fr 1.2fr;
			gap: 2px;
			margin: 0;
			padding: 2px;
			background-color: var(--bg-tertiary);
			border-radius: 4px;
			min-height: 0;
			align-self: start;
			width: 100%;
		}

		.summary-item {
			padding: 3px 6px;
			border-radius: 4px;
			font-size: 0.95em;
			display: flex;
			align-items: center;
			border-left: 4px solid transparent;
			min-width: 0;
			background-color: var(--bg-secondary);
			border: 1px solid var(--border-color);
		}

		.summary-item .icon {
			margin-right: 5px;
			font-size: 1em;
			color: var(--icon-color);
			flex-shrink: 0;
		}

		.summary-item .label {
			color: var(--text-secondary);
			margin-right: auto;
			white-space: nowrap;
			font-size: 0.92em;
			font-weight: 500;
		}

		.summary-item .value {
			font-weight: bold;
			color: var(--text-primary);
			text-align: right;
			white-space: normal;
			word-break: break-all;
			flex-shrink: 1;
			font-size: 1.05em;
		}

		/* Status colors */
		.summary-item.status-good {
			border-left-color: var(--status-good-color);
		}

		.summary-item.status-good .value {
			color: var(--status-good-color);
		}

		.summary-item.status-warning {
			border-left-color: var(--status-warning-color);
		}

		.summary-item.status-warning .value {
			color: var(--status-warning-color);
		}

		.summary-item.status-critical {
			border-left-color: var(--status-critical-color);
		}

		.summary-item.status-critical .value {
			color: var(--status-critical-color);
		}

		.summary-item.status-info {
			border-left-color: var(--status-info-color);
		}

		.summary-item.status-info .value {
			color: var(--status-info-color);
		}

		.summary-item.status-neutral .value {
			color: var(--text-primary);
		}

		.cell-grid-wrapper {
			grid-area: cells;
			min-height: 0;
			overflow: hidden;
			display: flex;
			align-items: stretch;
			justify-content: center;
			padding: 0;
			width: 100%;
		}

		#battery-viewer-container {
			display: grid;
			grid-template-columns: repeat(8, minmax(0, 1fr));
			grid-auto-rows: minmax(0, 1fr);
			gap: 4px;
			width: 100%;
			height: 100%;
			max-height: 100%;
			align-content: stretch;
		}

		.cell {
			border: 1px solid var(--cell-border-default);
			border-radius: 4px 4px 2px 2px;
			padding: 3px 2px 2px;
			text-align: center;
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background-color: var(--cell-default-bg);
			transition: background-color 0.5s ease-in-out;
			min-height: 0;
			overflow: hidden;
			container-type: size;
			container-name: bms-cell;
		}

		.bms-dashboard.compact .summary-item {
			padding: 2px 5px;
			font-size: 0.88em;
			border-left-width: 3px;
		}

		.bms-dashboard.compact .summary-item .icon {
			margin-right: 4px;
			font-size: 0.95em;
		}

		.bms-dashboard.compact .summary-data-top,
		.bms-dashboard.compact .summary-data-bottom {
			gap: 1px;
			padding: 1px;
		}

		.bms-dashboard.compact #battery-viewer-container {
			gap: 3px;
		}

		.bms-dashboard.ultra-compact .summary-item .icon {
			display: none;
		}

		.bms-dashboard.ultra-compact .summary-item {
			padding: 1px 4px;
			font-size: 0.84em;
		}

		.cell::before {
			content: "";
			position: absolute;
			top: 0;
			left: 50%;
			transform: translate(-50%, -55%);
			width: 45%;
			height: 3px;
			background-color: var(--cell-cap-bg);
			border: 1px solid var(--cell-cap-border);
			border-bottom: none;
			border-radius: 2px 2px 0 0;
		}

		.cell-header {
			font-size: clamp(0.58rem, 16cqh, 0.78rem);
			font-weight: 600;
			color: var(--cell-text-color);
			text-shadow: var(--cell-text-shadow);
			line-height: 1.05;
		}

		.cell-voltage {
			/* Balanced: readable but not oversized for the cell band */
			font-size: clamp(0.7rem, 24cqh, 0.95rem);
			font-weight: 700;
			color: var(--cell-text-color);
			text-shadow: var(--cell-text-shadow);
			line-height: 1.05;
			margin-bottom: 0;
			letter-spacing: -0.01em;
			padding: 0 0.1rem;
		}

		.indicator {
			position: absolute;
			padding: 0;
			border-radius: 2px;
			font-size: clamp(0.55rem, 16cqh, 0.72rem);
			font-weight: bold;
			color: white;
			line-height: 1;
			width: 1.3em;
			height: 1.3em;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1;
			pointer-events: none;
		}

		.indicator.high,
		.indicator.low {
			top: 2px;
			right: 2px;
			left: auto;
		}

		.indicator.balancing {
			bottom: 2px;
			right: 2px;
			background-color: var(--status-warning-color);
			animation: pulse-indicator 1.5s infinite;
		}

		.indicator.high {
			background-color: var(--status-critical-color);
		}

		.indicator.low {
			background-color: var(--status-info-color);
		}

		@keyframes pulse-indicator {
			0% {
				box-shadow: 0 0 0 0 color-mix(in srgb, var(--status-warning-color) 60%, transparent);
			}

			70% {
				box-shadow: 0 0 0 6px color-mix(in srgb, var(--status-warning-color) 0%, transparent);
			}

			100% {
				box-shadow: 0 0 0 0 color-mix(in srgb, var(--status-warning-color) 0%, transparent);
			}
		}
	</style>
</head>

<body>
	<div class="bms-dashboard">
		<div class="summary-data-top">
			<div class="summary-item" id="pack-selector-wrap" style="display:none; grid-column: 1 / -1;">
				<span class="icon">📚</span><span class="label">Pack:</span>
				<select id="bms-pack-selector" style="margin-left:6px;"></select>
			</div>
			<div class="summary-item" id="battery-flow"><span class="icon">🔋</span><span class="label">Flow:</span>
				<span class="value">--</span>
			</div>
			<div class="summary-item" id="pack-voltage"><span class="icon">⚡</span><span class="label">Pack V:</span>
				<span class="value">-- V</span>
			</div>
			<div class="summary-item" id="port-voltage"><span class="icon">🔌</span><span class="label">Port V:</span>
				<span class="value">-- V</span>
			</div>
			<div class="summary-item" id="remaining-ah"><span class="icon">⏳</span><span class="label">Ah Rem:</span>
				<span class="value">-- Ah</span>
			</div>
			<div class="summary-item" id="soc"><span class="icon">📊</span><span class="label">SOC:</span> <span
					class="value">-- %</span></div>
			<div class="summary-item" id="soh"><span class="icon">❤️</span><span class="label">SOH:</span> <span
					class="value">-- %</span></div>
			<div class="summary-item" id="cycles"><span class="icon">🔄</span><span class="label">Cycles:</span> <span
					class="value">--</span></div>
			<div class="summary-item" id="bms-temp"><span class="icon">🌡️</span><span class="label">Temps:</span> <span
					class="value">--</span></div>
			<div class="summary-item" id="total-capacity"><span class="icon">📦</span><span class="label">Total
					Ah:</span> <span class="value">-- Ah</span></div>
		</div>

		<div class="cell-grid-wrapper">
			<div id="battery-viewer-container"></div>
		</div>

		<div class="summary-data-bottom">
			<div class="summary-item" id="delta-cell-voltage"><span class="icon">↔️</span><span class="label">ΔV
					Cell:</span> <span class="value">-- V</span></div>
			<div class="summary-item" id="highest-cell-info"><span class="icon">🔼</span><span class="label">Hi
					Cell:</span> <span class="value">--</span></div>
			<div class="summary-item" id="lowest-cell-info"><span class="icon">🔽</span><span class="label">Lo
					Cell:</span> <span class="value">--</span></div>
			<div class="summary-item" id="average-cell-voltage"><span class="icon">⌀</span><span class="label">Avg
					Cell:</span> <span class="value">-- V</span></div>
			<div class="summary-item" id="min-pack-voltage-config"><span class="icon">⚙️</span><span class="label">Min
					Pack:</span> <span class="value">-- V</span></div>
			<div class="summary-item" id="max-pack-voltage-config"><span class="icon">⚙️</span><span class="label">Max
					Pack:</span> <span class="value">-- V</span></div>
		</div>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const htmlElement = document.documentElement;
			const container = document.getElementById('battery-viewer-container');

			const bmsDashboard = document.querySelector('.bms-dashboard');
			const BASE_FONT_SIZE = 13;
			const BASE_CONTAINER_WIDTH = 600;
			const MIN_FONT_SIZE = 12;
			const MAX_FONT_SIZE = 15;
			const NUM_CELLS_DEFAULT = 16;
			let NUM_CELLS = NUM_CELLS_DEFAULT;

			const debounce = (func, wait) => {
				let timeout;
				return function executedFunction(...args) {
					const later = () => {
						clearTimeout(timeout);
						func(...args);
					};
					clearTimeout(timeout);
					timeout = setTimeout(later, wait);
				};
			};

			const updateCellGridLayout = (cellCount) => {
				if (!container) return;
				const count = Math.max(1, cellCount || NUM_CELLS || 16);
				const w = bmsDashboard ? bmsDashboard.clientWidth : container.clientWidth;
				const h = bmsDashboard ? bmsDashboard.clientHeight : container.clientHeight;
				let cols = 8;
				if (w < 320) cols = 4;
				else if (w < 420) cols = 6;
				else if (count <= 8) cols = Math.min(8, count);
				const rows = Math.max(1, Math.ceil(count / cols));
				container.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
				container.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
				container.style.gridAutoRows = '';
				if (bmsDashboard) {
					bmsDashboard.classList.toggle('compact', h < 480 || w < 400);
					bmsDashboard.classList.toggle('ultra-compact', h < 340 || w < 300);
				}
			};

			const fitBmsLayout = () => {
				if (!bmsDashboard) return;
				const top = bmsDashboard.querySelector('.summary-data-top');
				const bottom = bmsDashboard.querySelector('.summary-data-bottom');
				const wrap = bmsDashboard.querySelector('.cell-grid-wrapper');
				if (!top || !bottom || !wrap) return;

				const dashH = bmsDashboard.clientHeight;
				const styles = getComputedStyle(bmsDashboard);
				const gap = parseFloat(styles.rowGap || styles.gap || '0') || 0;
				// Force bottom to contribute its full intrinsic height (both rows)
				bottom.style.height = 'auto';
				const topH = top.offsetHeight;
				const bottomH = bottom.scrollHeight || bottom.offsetHeight;
				const reserved = topH + bottomH + gap * 2;
				const cellBand = Math.max(36, dashH - reserved);
				wrap.style.height = `${cellBand}px`;
				wrap.style.maxHeight = `${cellBand}px`;
				wrap.style.minHeight = '0';
				updateCellGridLayout(NUM_CELLS);
			};

			const updateFontSize = () => {
				if (!bmsDashboard) return;
				const currentWidth = bmsDashboard.clientWidth;
				const widthScale = currentWidth / BASE_CONTAINER_WIDTH;
				let newSize = BASE_FONT_SIZE * Math.max(0.95, Math.min(1.15, widthScale));
				const clampedSize = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, newSize));
				htmlElement.style.fontSize = `${clampedSize}px`;
				fitBmsLayout();
			};

			window.addEventListener('resize', debounce(updateFontSize, 50));
			if (typeof ResizeObserver !== 'undefined' && bmsDashboard) {
				new ResizeObserver(debounce(updateFontSize, 40)).observe(bmsDashboard);
			}

			function safeNum(v, fallback = null) {
				if (v === null || v === undefined || v === '' || v === 'N/A') return fallback;
				const n = Number(v);
				return Number.isFinite(n) ? n : fallback;
			}

			function fmtFixed(v, digits, fallback = '--') {
				const n = safeNum(v, null);
				return n === null ? fallback : n.toFixed(digits);
			}
			const VOLTAGE_THRESHOLDS_CELL = {
				CRITICAL_LOW: 2.80,
				LOW_WARN: 3.15,
				NORMAL_HIGH_END: 3.45,
				HIGH_WARN: 3.55,
				CRITICAL_HIGH: 3.65
			};
			const GRADIENT_COLORS_DARK = {
				'voltage-critical-low': {
					start: '#ef4444',
					end: '#b91c1c'
				},
				'voltage-low-warn': {
					start: '#f59e0b',
					end: '#b45309'
				},
				'voltage-normal': {
					start: '#10b981',
					end: '#047857'
				},
				'voltage-high-warn': {
					start: '#facc15',
					end: '#ca8a04'
				},
				'voltage-critical-high': {
					start: '#dc2626',
					end: '#991b1b'
				}
			};
			const GRADIENT_COLORS_LIGHT = {
				'voltage-critical-low': {
					start: '#fecaca',
					end: '#f87171'
				},
				'voltage-low-warn': {
					start: '#fed7aa',
					end: '#fb923c'
				},
				'voltage-normal': {
					start: '#a7f3d0',
					end: '#34d399'
				},
				'voltage-high-warn': {
					start: '#fef08a',
					end: '#facc15'
				},
				'voltage-critical-high': {
					start: '#ef4444',
					end: '#dc2626'
				}
			};

			let currentGradientColors = GRADIENT_COLORS_DARK;
			let cellElements = [];
			let cellData = Array(NUM_CELLS).fill(null).map((_, i) => ({
				id: i + 1,
				voltage: 3.200,
				balancing: false
			}));
			let summaryData = {
				batteryFlow: {
					status: "Idle",
					power: 0,
					icon: "🔋"
				},
				packVoltage: 51.2,
				portVoltage: 51.2,
				remainingAh: 100,
				soc: 75,
				soh: 99,
				cycles: 50,
				bmsTemp: 25,
				totalCapacity: 200,
				deltaCellVoltage: 0.000,
				averageCellVoltage: 3.200,
				highestCell: {
					ids: [],
					voltage: 0
				},
				lowestCell: {
					ids: [],
					voltage: 0
				},
				minPackVoltageConfig: 44.8,
				maxPackVoltageConfig: 58.4,
				packs: [],
				packCount: 0
			};
			let selectedPackId = null;
			const SUMMARY_THRESHOLDS = {
				packVoltage: {
					good: [50.0, 56.0],
					warningLow: [48.0, 49.9],
					warningHigh: [56.1, 57.5],
					criticalLow: 47.9,
					criticalHigh: 57.6
				},
				portVoltage: {
					good: [50.0, 56.0],
					warningLow: [48.0, 49.9],
					warningHigh: [56.1, 57.5],
					criticalLow: 47.9,
					criticalHigh: 57.6
				},
				remainingAh: {
					good: [80, Infinity],
					warning: [40, 79.9],
					critical: [-Infinity, 39.9]
				},
				soc: {
					good: [50, 100],
					warning: [20, 49.9],
					critical: [-Infinity, 19.9]
				},
				soh: {
					good: [95, 100],
					warning: [90, 94.9],
					critical: [-Infinity, 89.9]
				},
				bmsTemp: {
					good: [10, 40],
					warningLow: [0, 9.9],
					warningHigh: [40.1, 45],
					criticalLow: -0.1,
					criticalHigh: 45.1
				},
				deltaCellVoltage: {
					good: [0, 0.020],
					warning: [0.021, 0.050],
					critical: [0.051, Infinity]
				}
			};

			function setTheme(themeName, palette) {
				// themeName may be 'light' | 'dark' | theme id. Optional palette overrides CSS vars.
				if (palette && typeof palette === 'object') {
					const root = htmlElement;
					const map = {
						bgPrimary: '--bg-primary',
						bgSecondary: '--bg-secondary',
						bgTertiary: '--bg-tertiary',
						textPrimary: '--text-primary',
						textSecondary: '--text-secondary',
						textAccent: '--text-accent',
						borderColor: '--border-color',
						cellBorder: '--cell-border-default',
						cellDefaultBg: '--cell-default-bg',
						iconColor: '--icon-color',
						cellCapBg: '--cell-cap-bg',
						cellCapBorder: '--cell-cap-border',
						cellText: '--cell-text-color',
					};
					for (const [key, cssVar] of Object.entries(map)) {
						if (palette[key] != null) root.style.setProperty(cssVar, palette[key]);
					}
					const mode = palette.mode || (themeName === 'dark' ? 'dark' : 'light');
					root.setAttribute('data-theme', mode === 'dark' ? 'dark' : (themeName || 'light'));
					root.style.setProperty('--cell-text-shadow', mode === 'dark' ? '0 0 2px black' : 'none');
					currentGradientColors = mode === 'dark' ? GRADIENT_COLORS_DARK : GRADIENT_COLORS_LIGHT;
				} else {
					const mode = themeName === 'dark' ? 'dark' : 'light';
					htmlElement.setAttribute('data-theme', mode);
					// Clear inline overrides so CSS theme blocks apply
					[
						'--bg-primary', '--bg-secondary', '--bg-tertiary', '--text-primary', '--text-secondary',
						'--text-accent', '--border-color', '--cell-border-default', '--cell-default-bg',
						'--icon-color', '--cell-cap-bg', '--cell-cap-border', '--cell-text-color', '--cell-text-shadow'
					].forEach((v) => htmlElement.style.removeProperty(v));
					currentGradientColors = mode === 'light' ? GRADIENT_COLORS_LIGHT : GRADIENT_COLORS_DARK;
				}
				renderAllData();
			}

			function getCellVoltageCategory(voltage) {
				if (voltage < VOLTAGE_THRESHOLDS_CELL.CRITICAL_LOW) return 'voltage-critical-low';
				if (voltage < VOLTAGE_THRESHOLDS_CELL.LOW_WARN) return 'voltage-low-warn';
				if (voltage <= VOLTAGE_THRESHOLDS_CELL.NORMAL_HIGH_END) return 'voltage-normal';
				if (voltage < VOLTAGE_THRESHOLDS_CELL.CRITICAL_HIGH) return 'voltage-high-warn';
				return 'voltage-critical-high';
			}

			function applySummaryItemStatus(elementId, value, thresholdsConfig) {
				const itemElement = document.getElementById(elementId);
				if (!itemElement) return;
				itemElement.className = 'summary-item status-neutral';
				if (!thresholdsConfig || Object.keys(thresholdsConfig).length === 0) return;
				if (thresholdsConfig.good && thresholdsConfig.warning && thresholdsConfig.critical && thresholdsConfig.critical[0] === -Infinity) {
					if (value >= thresholdsConfig.good[0]) itemElement.className = 'summary-item status-good';
					else if (value >= thresholdsConfig.warning[0]) itemElement.className = 'summary-item status-warning';
					else itemElement.className = 'summary-item status-critical';
				} else if (thresholdsConfig.good && thresholdsConfig.warning && thresholdsConfig.critical && thresholdsConfig.critical[1] === Infinity) {
					if (value <= thresholdsConfig.good[1]) itemElement.className = 'summary-item status-good';
					else if (value <= thresholdsConfig.warning[1]) itemElement.className = 'summary-item status-warning';
					else itemElement.className = 'summary-item status-critical';
				} else if (thresholdsConfig.good && thresholdsConfig.warningLow && thresholdsConfig.warningHigh && thresholdsConfig.criticalLow !== undefined && thresholdsConfig.criticalHigh !== undefined) {
					if (value < thresholdsConfig.criticalLow) itemElement.className = 'summary-item status-critical';
					else if (value >= thresholdsConfig.warningLow[0] && value <= thresholdsConfig.warningLow[1]) itemElement.className = 'summary-item status-warning';
					else if (value >= thresholdsConfig.good[0] && value <= thresholdsConfig.good[1]) itemElement.className = 'summary-item status-good';
					else if (value >= thresholdsConfig.warningHigh[0] && value <= thresholdsConfig.warningHigh[1]) itemElement.className = 'summary-item status-warning';
					else if (value > thresholdsConfig.criticalHigh) itemElement.className = 'summary-item status-critical';
				}
			}

			function createCellElement(cData) {
				const cellDiv = document.createElement('div');
				cellDiv.classList.add('cell');
				cellDiv.dataset.cellId = cData.id;
				const voltageDisplay = document.createElement('div');
				voltageDisplay.classList.add('cell-voltage');
				const header = document.createElement('div');
				header.classList.add('cell-header');
				header.textContent = `C${cData.id}`;
				cellDiv.appendChild(voltageDisplay);
				cellDiv.appendChild(header);
				return cellDiv;
			}

			function renderAllData() {
				let minV = Infinity,
					maxV = -Infinity,
					minVIds = [],
					maxVIds = [],
					totalV = 0;
				const usableCells = cellData.filter(c => safeNum(c.voltage, null) !== null);
				usableCells.forEach(cell => {
					const voltage = safeNum(cell.voltage, 0);
					totalV += voltage;
					if (voltage < minV) {
						minV = voltage;
						minVIds = [cell.id];
					} else if (voltage === minV) {
						minVIds.push(cell.id);
					}
					if (voltage > maxV) {
						maxV = voltage;
						maxVIds = [cell.id];
					} else if (voltage === maxV) {
						maxVIds.push(cell.id);
					}
				});
				summaryData.averageCellVoltage = usableCells.length > 0 ? totalV / usableCells.length : 0;
				const allSameV = usableCells.length > 0 && usableCells.every(c => safeNum(c.voltage, 0) === safeNum(usableCells[0].voltage, 0));
				summaryData.deltaCellVoltage = (usableCells.length > 0 && !allSameV && Number.isFinite(minV) && Number.isFinite(maxV)) ? maxV - minV : 0;
				summaryData.highestCell = {
					ids: maxVIds,
					voltage: Number.isFinite(maxV) ? maxV : 0
				};
				summaryData.lowestCell = {
					ids: minVIds,
					voltage: Number.isFinite(minV) ? minV : 0
				};
				cellElements.forEach((cellDiv, index) => {
					const currentCell = cellData[index];
					if (!currentCell) return;
					cellDiv.querySelector('.cell-voltage').textContent = `${fmtFixed(currentCell.voltage, 3)}V`;
					const VCategory = getCellVoltageCategory(safeNum(currentCell.voltage, 0));
					const gradConf = currentGradientColors[VCategory];

					if (gradConf) {
						cellDiv.style.backgroundColor = gradConf.start;
						cellDiv.style.backgroundImage = `linear-gradient(to bottom, ${gradConf.start}, ${gradConf.end})`;
					} else {
						const defaultCellBg = getComputedStyle(document.documentElement).getPropertyValue('--cell-default-bg').trim();
						cellDiv.style.backgroundColor = defaultCellBg;
						cellDiv.style.backgroundImage = 'none';
					}
					cellDiv.querySelectorAll('.indicator').forEach(ind => ind.remove());
					if (!allSameV) {
						if (summaryData.highestCell.ids.includes(currentCell.id)) {
							const hi = document.createElement('span');
							hi.className = 'indicator high';
							hi.textContent = '▲';
							cellDiv.appendChild(hi);
						}
						if (summaryData.lowestCell.ids.includes(currentCell.id)) {
							const lo = document.createElement('span');
							lo.className = 'indicator low';
							lo.textContent = '▼';
							cellDiv.appendChild(lo);
						}
					}
					if (currentCell.balancing) {
						const bal = document.createElement('span');
						bal.className = 'indicator balancing';
						bal.textContent = 'B';
						cellDiv.appendChild(bal);
					}
				});
				let flowText = summaryData.batteryFlow.status;
				let flowIcon = "🔋";
				if (summaryData.batteryFlow.status === "Charging") flowIcon = "🔌";
				else if (summaryData.batteryFlow.status === "Discharging") flowIcon = "💨";
				else if (summaryData.batteryFlow.status === "Idle") flowIcon = "⏸️";
				if (summaryData.batteryFlow.power !== 0) flowText = `${fmtFixed(Math.abs(safeNum(summaryData.batteryFlow.power, 0)), 0, '0')}W`;
				else flowText = "Idle";
				document.querySelector('#battery-flow .icon').textContent = flowIcon;
				document.querySelector('#battery-flow .value').textContent = flowText;
				applySummaryItemStatus('battery-flow', safeNum(summaryData.batteryFlow.power, 0), {
					info: [-Infinity, Infinity]
				});

				const packWrap = document.getElementById('pack-selector-wrap');
				const packSel = document.getElementById('bms-pack-selector');
				let packs = summaryData.packs;
				if (typeof packs === 'string') {
					try { packs = JSON.parse(packs); } catch (e) { packs = []; }
				}
				if (packWrap && packSel && Array.isArray(packs) && packs.length > 1) {
					packWrap.style.display = '';
					const current = packSel.value;
					packSel.innerHTML = packs.map(p => {
						const id = (p && p.instance_id) ? p.instance_id : '?';
						return `<option value="${id}">${id}</option>`;
					}).join('');
					if (current && [...packSel.options].some(o => o.value === current)) {
						packSel.value = current;
						selectedPackId = current;
					} else if (!selectedPackId) {
						selectedPackId = packSel.value;
					} else {
						packSel.value = selectedPackId;
					}
					const chosen = packs.find(p => p && p.instance_id === packSel.value);
					if (chosen) {
						if (chosen.soc != null) summaryData.soc = chosen.soc;
						if (chosen.voltage != null) summaryData.packVoltage = chosen.voltage;
						if (chosen.power != null) {
							summaryData.batteryFlow = summaryData.batteryFlow || {};
							summaryData.batteryFlow.power = chosen.power;
							summaryData.batteryFlow.status = chosen.status || summaryData.batteryFlow.status;
						}
						if (chosen.remaining_ah != null) summaryData.remainingAh = chosen.remaining_ah;
						if (chosen.full_ah != null) summaryData.totalCapacity = chosen.full_ah;
						if (chosen.soh != null) summaryData.soh = chosen.soh;
					}
					packSel.onchange = () => {
						selectedPackId = packSel.value;
						renderAllData();
					};
				} else if (packWrap) {
					packWrap.style.display = 'none';
				}

				document.querySelector('#pack-voltage .value').textContent = `${fmtFixed(summaryData.packVoltage, 1)}V`;
				applySummaryItemStatus('pack-voltage', safeNum(summaryData.packVoltage, 0), SUMMARY_THRESHOLDS.packVoltage);
				document.querySelector('#port-voltage .value').textContent = `${fmtFixed(summaryData.portVoltage, 1)}V`;
				applySummaryItemStatus('port-voltage', safeNum(summaryData.portVoltage, 0), SUMMARY_THRESHOLDS.portVoltage);
				document.querySelector('#remaining-ah .value').textContent = `${fmtFixed(summaryData.remainingAh, 0)}Ah`;
				applySummaryItemStatus('remaining-ah', safeNum(summaryData.remainingAh, 0), SUMMARY_THRESHOLDS.remainingAh);
				document.querySelector('#soc .value').textContent = `${fmtFixed(summaryData.soc, 0)}%`;
				applySummaryItemStatus('soc', safeNum(summaryData.soc, 0), SUMMARY_THRESHOLDS.soc);
				document.querySelector('#soh .value').textContent = `${fmtFixed(summaryData.soh, 0)}%`;
				applySummaryItemStatus('soh', safeNum(summaryData.soh, 0), SUMMARY_THRESHOLDS.soh);
				document.querySelector('#cycles .value').textContent = fmtFixed(summaryData.cycles, 0);
				applySummaryItemStatus('cycles', safeNum(summaryData.cycles, 0), {});
				const tempValueEl = document.querySelector('#bms-temp .value');
				const temps = (summaryData.bmsTemperatures || []).map(t => safeNum(t, null)).filter(t => t !== null);
				if (temps.length > 0) {
					const tempMin = Math.min(...temps);
					const tempMax = Math.max(...temps);
					tempValueEl.textContent = `${fmtFixed(tempMin, 1)}°C / ${fmtFixed(tempMax, 1)}°C`;
					applySummaryItemStatus('bms-temp', tempMax, SUMMARY_THRESHOLDS.bmsTemp);
				} else {
					tempValueEl.textContent = "--";
					applySummaryItemStatus('bms-temp', null, {});
				}
				document.querySelector('#total-capacity .value').textContent = `${fmtFixed(summaryData.totalCapacity, 0)}Ah`;
				applySummaryItemStatus('total-capacity', safeNum(summaryData.totalCapacity, 0), {});
				document.querySelector('#delta-cell-voltage .value').textContent = `${fmtFixed(summaryData.deltaCellVoltage, 3)}V`;
				applySummaryItemStatus('delta-cell-voltage', safeNum(summaryData.deltaCellVoltage, 0), SUMMARY_THRESHOLDS.deltaCellVoltage);
				let hiCellTxt = "--";
				if (usableCells.length > 0 && !allSameV && summaryData.highestCell.ids && summaryData.highestCell.ids.length > 0) {
					hiCellTxt = summaryData.highestCell.ids.join(',');
				}
				document.querySelector('#highest-cell-info .value').textContent = hiCellTxt;
				applySummaryItemStatus('highest-cell-info', safeNum(summaryData.highestCell.voltage, 0), {});
				let loCellTxt = "--";
				if (usableCells.length > 0 && !allSameV && summaryData.lowestCell.ids && summaryData.lowestCell.ids.length > 0) {
					loCellTxt = summaryData.lowestCell.ids.join(',');
				}
				document.querySelector('#lowest-cell-info .value').textContent = loCellTxt;
				applySummaryItemStatus('lowest-cell-info', safeNum(summaryData.lowestCell.voltage, 0), {});
				document.querySelector('#average-cell-voltage .value').textContent = `${fmtFixed(summaryData.averageCellVoltage, 2)}V`;
				applySummaryItemStatus('average-cell-voltage', safeNum(summaryData.averageCellVoltage, 0), {});
				document.querySelector('#min-pack-voltage-config .value').textContent = `${fmtFixed(summaryData.minPackVoltageConfig, 1)}V`;
				applySummaryItemStatus('min-pack-voltage-config', safeNum(summaryData.minPackVoltageConfig, 0), {});
				document.querySelector('#max-pack-voltage-config .value').textContent = `${fmtFixed(summaryData.maxPackVoltageConfig, 1)}V`;
				applySummaryItemStatus('max-pack-voltage-config', safeNum(summaryData.maxPackVoltageConfig, 0), {});
				fitBmsLayout();
			}

			function initializeViewer() {
				container.innerHTML = '';
				cellElements = [];
				cellData.forEach(cDt => {
					const cEl = createCellElement(cDt);
					container.appendChild(cEl);
					cellElements.push(cEl);
				});
				updateFontSize();
				renderAllData();
			}

			window.bmsViewer = {
				updateData: function (newData) {
					if (newData && newData.cells && newData.cells.length > 0) {
						NUM_CELLS = newData.cells.length;
						cellData = newData.cells.map((d, i) => ({
							id: d.id !== undefined ? d.id : i + 1,
							voltage: safeNum(d.voltage, null),
							balancing: !!d.balancing
						}));
						if (cellElements.length !== cellData.length) {
							initializeViewer();
							return;
						}
					}
					if (newData && newData.summary) {
						summaryData = {
							...summaryData,
							...newData.summary
						};
					}
					renderAllData();
				},
				setTheme: function (themeName, palette) {
					setTheme(themeName, palette);
				}
			};

			initializeViewer();
		});
	</script>
</body>
